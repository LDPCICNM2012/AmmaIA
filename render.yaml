services:
  - type: web
    name: ammaia-backend
    env: python
    region: frankfurt # o oregon / ohio
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run_backend.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: HOST
        value: 0.0.0.0
      - key: DEFAULT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false # Configurar en el Dashboard de Render (Secret)
      - key: JWT_SECRET
        generateValue: true # Genera clave secreta segura automáticamente
